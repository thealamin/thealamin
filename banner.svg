<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Alamin: Website Designer, Developer and Cyber Security Expert</title>
  <desc id="d">Websites that sell, apps that scale, businesses that stay secure. 600+ projects, 4.9 average rating. thealamin.com</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#0f2a30" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowC" cx="18%" cy="30%" r="55%">
      <stop offset="0" stop-color="#00e5ff" stop-opacity=".20"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowP" cx="88%" cy="85%" r="50%">
      <stop offset="0" stop-color="#ff2d75" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ff2d75" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#ff2d75"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset=".85" stop-color="#00e5ff" stop-opacity=".09"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1280" height="360" rx="18"/></clipPath>
    <style>
      .sans{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
      .mono{font-family:Consolas,Menlo,'DejaVu Sans Mono','Courier New',monospace}
      .rot{opacity:0;animation:rot 9s infinite}
      .r2{animation-delay:3s}.r3{animation-delay:6s}
      @keyframes rot{0%{opacity:0;transform:translateY(8px)}4%,29%{opacity:1;transform:translateY(0)}33%,100%{opacity:0;transform:translateY(-8px)}}
      .blink{animation:blink 1.1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .scan{animation:scan 6s linear infinite}
      @keyframes scan{from{transform:translateY(-120px)}to{transform:translateY(380px)}}
      .pulse{animation:pulse 2s ease-in-out infinite}
      @keyframes pulse{50%{opacity:.35}}
      @media (prefers-reduced-motion:reduce){.rot,.r2,.r3{animation:none}.r1{opacity:1}.scan,.blink,.pulse{animation:none}}
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="360" fill="#060606"/>
    <rect width="1280" height="360" fill="url(#grid)"/>
    <rect width="1280" height="360" fill="url(#glowC)"/>
    <rect width="1280" height="360" fill="url(#glowP)"/>
    <rect class="scan" x="0" y="0" width="1280" height="110" fill="url(#scan)"/>

    <!-- left: name and roles -->
    <text x="64" y="88" class="mono" font-size="20" fill="#00e5ff" letter-spacing="3">HI, I'M</text>
    <text x="60" y="178" class="sans" font-size="100" font-weight="800" fill="#ffffff" letter-spacing="2">ALAMIN</text>
    <rect x="64" y="196" width="150" height="5" rx="2.5" fill="url(#line)"/>
    <text x="64" y="240" class="sans" font-size="27" font-weight="600" fill="#e4e8ff">Designer · Developer · Security Expert</text>

    <g class="sans" font-size="32" font-weight="800">
      <text x="64" y="292" class="rot r1" fill="#00e5ff">Websites That Sell</text>
      <text x="64" y="292" class="rot r2" fill="#ffb84d">Apps That Scale</text>
      <text x="64" y="292" class="rot r3" fill="#00ff9c">Businesses That Stay Secure</text>
    </g>
    <text x="64" y="330" class="mono" font-size="17" fill="#7f8aa3">thealamin.com  ·  Dhaka, Bangladesh  ·  working worldwide</text>

    <!-- right: terminal card -->
    <g transform="translate(742 54)">
      <rect width="478" height="252" rx="14" fill="#0b0f14" stroke="#1c3a42"/>
      <path d="M0 14a14 14 0 0 1 14-14h450a14 14 0 0 1 14 14v26H0z" fill="#111821"/>
      <circle cx="24" cy="20" r="6" fill="#ff5f57"/>
      <circle cx="44" cy="20" r="6" fill="#febc2e"/>
      <circle cx="64" cy="20" r="6" fill="#28c840"/>
      <text x="239" y="25" text-anchor="middle" class="mono" font-size="14" fill="#7f8aa3">alamin@secure:~</text>
      <g class="mono" font-size="18">
        <text x="22" y="76"><tspan fill="#00ff9c">$</tspan><tspan fill="#e4e8ff"> whoami</tspan></text>
        <text x="22" y="102" fill="#9fb3c8">web designer + developer + security</text>
        <text x="22" y="138"><tspan fill="#00ff9c">$</tspan><tspan fill="#e4e8ff"> clients --summary</tspan></text>
        <text x="22" y="164"><tspan fill="#00e5ff">600+ projects</tspan><tspan fill="#9fb3c8">  ·  </tspan><tspan fill="#ffb84d">4.9★ rating</tspan></text>
        <text x="22" y="200"><tspan fill="#00ff9c">$</tspan><tspan fill="#e4e8ff"> status</tspan></text>
        <text x="22" y="228"><tspan class="pulse" fill="#00ff9c">●</tspan><tspan fill="#e4e8ff"> open for new projects</tspan><tspan class="blink" fill="#00e5ff"> █</tspan></text>
      </g>
    </g>
  </g>
  <rect x=".5" y=".5" width="1279" height="359" rx="18" fill="none" stroke="#14323a"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
